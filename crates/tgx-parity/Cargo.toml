[package]
name = "tgx-parity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The oracle. Replays a real Telegram Desktop export through our writers and diffs."

[lib]
name = "tgx_parity"
path = "src/lib.rs"

[[bin]]
name = "tgx-parity"
path = "src/main.rs"

[dependencies]
tgx-format = { path = "../tgx-format" }
serde_json = { workspace = true }
anyhow = { workspace = true }
regex = "1"
sha2 = "0.10"
tgx-html = { path = "../tgx-html" }
tgx-media = { path = "../tgx-media" }

# The store, for the archive leg. **Never `tgx-tg`** — see `tests/layering.rs`.
# The whole point of a store that takes serialised maps is that the oracle can
# replay a recorded export through it with no connection.
tgx-archive = { path = "../tgx-archive" }
# The store's methods are async because libsql's are, so the leg drives them on
# a current-thread runtime it builds itself. No other leg needs one.
tokio = { version = "1", features = ["rt", "time"] }
