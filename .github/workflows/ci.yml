name: CI

# What CI can and cannot check.
#
# The three parity legs need a real Desktop export. `cargo run -p tgx-parity --
# corpus <root>` cuts the text half of one into `reference/` — 7.8 MB instead of
# 278 MB, and enough for all three legs to return the same numbers they return
# against the drive. `cargo test --all` runs them from `tests/corpus.rs`.
#
# `reference/` is gitignored, because it is verbatim chat history and a push
# publishes it. So on this repository as configured, the corpus test SKIPS here
# and prints that it did — CI proves the unit tests, not the parity legs. A fork
# that commits its own corpus gets the legs in CI with no change to this file.
on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `--locked` on every cargo step that resolves dependencies. Without it a
      # stale or absent `Cargo.lock` is silently *rewritten* to whatever the
      # registry offers today, so CI would be judging a dependency set no
      # developer ever built — and `gpui`/`gpui-component` are pinned exactly
      # (see CLAUDE.md) precisely because a pre-1.0 bump can break the interface
      # with no code change of ours. With it, an out-of-date lock file fails the
      # run and says so. `cargo fmt` takes no `--locked`: it resolves nothing.
      - name: Format
        run: cargo fmt --all --check

      # `-- -D warnings` is redundant *today* — the `RUSTFLAGS: -D warnings`
      # above already reaches clippy, because clippy runs as a rustc wrapper and
      # its lints land in rustc's `warnings` group. Measured, not assumed: a
      # scratch crate with a `&Vec<i32>` parameter fails this exact command with
      # "`-D clippy::ptr-arg` implied by `-D warnings`". It is spelled out
      # anyway, because that chain is three deniable steps long and anyone who
      # narrows RUSTFLAGS to a target, or moves it, turns lint denial off
      # without touching this line. save.bat and CLAUDE.md both promise denial.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # --nocapture because the corpus skip notice is an eprintln! from a
      # *passing* test, and libtest discards stdout and stderr for those. The
      # comment at the top of this file has been claiming since it was written
      # that the skip "prints that it did"; without this it never printed.
      - name: Test
        run: cargo test --locked --all -- --nocapture

      # And because a line in a 500-test log is not the same as being told:
      # `reference/` is gitignored, so it can never be here, so the three legs
      # can never run here. An annotation lands on the run summary where a
      # human will see it without opening the log.
      - name: Note that the parity legs did not run
        if: ${{ hashFiles('reference/MANIFEST.txt') == '' }}
        run: echo "::warning::the parity legs did not run - no corpus on CI (reference/ is gitignored, so json/html/media were skipped)"

      - name: Release build
        run: cargo build --locked --release -p tgx-app

      # The Python build was 46.4 MB via PyInstaller and the Rust one is
      # 19.5 MB. Both numbers were stale here and disagreed with the README,
      # the ROADMAP and save.bat, which is exactly the way a "sudden jump"
      # stops being visible.
      # Record it so a sudden jump is visible, the way the
      # Git-Bash-vs-PowerShell OpenSSL discovery was (+2.5 MB from the wrong
      # build shell).
      - name: Binary size
        shell: pwsh
        run: |
          $exe = "target/release/TelegramExporter.exe"
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "TelegramExporter.exe is $mb MB"
          if ($mb -gt 30) {
            Write-Error "binary grew past 30 MB — something large got linked in"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TelegramExporter
          path: target/release/TelegramExporter.exe
